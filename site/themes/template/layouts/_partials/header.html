{{- /* header.html - top-level navbar for site */ -}}
<div>
  <nav class="w-full border-b border-gray-800 site-nav text-gray-100">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">
        <!-- Left: avatar + title -->
        <div class="flex items-center gap-3">

          <a href="{{ site.Home.RelPermalink }}#top" data-no-swup class="flex items-center gap-3 group" aria-label="Homepage">

            <img src='{{ with site.Params.avatar }}{{ . | relURL }}{{ else }}{{ "/images/avatar.jpg" | relURL }}{{ end
              }}' alt="{{ site.Title }}"
              class="w-10 h-10 rounded-sm border-2 border-gray-700 object-cover transition-transform duration-300 transform group-hover:scale-105"
              style="animation: border-breathe 4s ease-in-out infinite;" />
            <span class="text-white text-lg sm:text-xl md:text-2xl lg:text-3xl font-semibold tracking-wide">
              {{ site.Title }}
              <span class="inline-block ml-2" style="animation: flicker 1.6s steps(2, end) infinite;">_</span>
            </span>
          </a>
        </div>

        <!-- Right: menu (desktop) + mobile toggle -->
        <div class="flex items-center gap-4">
          <!-- Desktop menu (hidden on small screens) -->
          <div class="hidden md:flex items-center">
            {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
          </div>

          <!-- Mobile: sandwich button -->
          <div class="md:hidden">
            <button id="nav-toggle" aria-controls="mobile-menu" aria-expanded="false"
              class="inline-flex items-center justify-center p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400"
              aria-label="Open menu">
              <svg class="h-6 w-6 text-gray-200" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile menu (hidden by default) -->
      <div id="mobile-menu" class="md:hidden hidden pb-4">
        {{/* Reuse menu partial for mobile layout; partial is written to output flexible markup */}}
        {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
      </div>
    </div>
  </nav>

  <!-- Minimal, self-contained animations -->
  <style>
    .site-nav { background: #070709; }
    #site-header[data-scrolled] .site-nav {
      background: rgb(7 7 9 / 88%);
      backdrop-filter: blur(8px);
    }
    .site-nav [data-section][aria-current="location"] {
      color: #c7d2fe;
      box-shadow: inset 0 -2px #818cf8;
    }
    .site-nav a:focus-visible { outline: 2px solid #a5b4fc; }
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
    }
    @media (prefers-reduced-motion: reduce) {
      .site-nav a * { animation: none !important; }
    }
    @keyframes flicker {
      0% {
        opacity: 1;
        transform: translateY(0);
      }

      10% {
        opacity: 0.2;
        transform: translateY(-1px);
      }

      20% {
        opacity: 1;
        transform: translateY(0);
      }

      100% {
        opacity: 1;
      }
    }

    @keyframes border-breathe {
      0% {
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.06);
      }

      50% {
        box-shadow: 0 0 18px 6px rgba(99, 102, 241, 0.03);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.06);
      }
    }
  </style>

  <!-- Tiny toggle script (vanilla JS) -->
  <script>
    (function () {
      const header = document.getElementById('site-header');
      const button = document.getElementById('nav-toggle');
      const menu = document.getElementById('mobile-menu');
      const links = Array.from(header.querySelectorAll('[data-section]'));
      const sectionIds = [...new Set(links.map(link => link.dataset.section))];
      let sections = [];
      let frame = 0;
      let current;
      let clickedHash;

      function setMenu(open) {
        menu.classList.toggle('hidden', !open);
        button.setAttribute('aria-expanded', String(open));
        button.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      }

      function updateNavigation() {
        frame = 0;
        header.toggleAttribute('data-scrolled', window.scrollY > 8);
        const readingLine = header.getBoundingClientRect().bottom + 48;
        let active = sections[0];
        for (const section of sections) {
          if (section.getBoundingClientRect().top <= readingLine) active = section;
        }
        if (window.scrollY > 0 && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2) {
          active = sections[sections.length - 1];
        }
        if (active === current) return;
        current = active;
        for (const link of links) {
          if (link.dataset.section === active?.id) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        }
      }

      function scheduleUpdate() {
        if (!frame) frame = requestAnimationFrame(updateNavigation);
      }

      function refreshSections() {
        sections = sectionIds.map(id => document.getElementById(id)).filter(Boolean);
        setMenu(false);
        scheduleUpdate();
      }

      button.addEventListener('click', () => {
        setMenu(button.getAttribute('aria-expanded') !== 'true');
        scheduleUpdate();
      });
      header.addEventListener('click', event => {
        const link = event.target.closest('a');
        if (!link) return;
        setMenu(false);
        if (link.hash && link.pathname === location.pathname && link.hash !== location.hash) {
          clickedHash = link.hash;
        }
      });
      header.addEventListener('keydown', event => {
        if (event.key === 'Escape' && button.getAttribute('aria-expanded') === 'true') {
          setMenu(false);
          button.focus();
          scheduleUpdate();
        }
      });
      window.matchMedia('(min-width: 768px)').addEventListener('change', () => setMenu(false));
      window.addEventListener('scroll', scheduleUpdate, { passive: true });
      window.addEventListener('resize', scheduleUpdate);
      window.addEventListener('hashchange', () => {
        const target = document.getElementById(location.hash.slice(1));
        if (target && clickedHash !== location.hash) {
          requestAnimationFrame(() => target.scrollIntoView({ behavior: 'instant' }));
        }
        clickedHash = undefined;
        scheduleUpdate();
      });
      window.swup?.hooks.on('page:view', refreshSections);
      document.addEventListener("DOMContentLoaded", refreshSections, { once: true });
    })();
  </script>
</div>
